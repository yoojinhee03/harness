version: 2
updates:
  # 백엔드 파이썬(uv 워크스페이스 — pyproject 기반)
  - package-ecosystem: pip
    directory: /harness-architect
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # 웹 프론트(pnpm)
  - package-ecosystem: npm
    directory: /harness-architect/apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # VSCode 확장(npm)
  - package-ecosystem: npm
    directory: /harness-architect/apps/vscode
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # 백엔드 도커 베이스 이미지
  - package-ecosystem: docker
    directory: /harness-architect
    schedule:
      interval: weekly

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
