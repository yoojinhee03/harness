name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Sync
        working-directory: harness-architect
        run: uv sync --all-packages --dev
      - name: Lint (ruff)
        working-directory: harness-architect
        run: uv run ruff check .
      - name: Types (mypy)
        working-directory: harness-architect
        run: uv run mypy packages/resolver/src packages/catalog/src packages/runtime/src apps/api/src apps/cli/src apps/mcp/src
      - name: Test (pytest)
        working-directory: harness-architect
        run: uv run pytest -q
      - name: Migrations up-to-date (alembic)
        working-directory: harness-architect
        env:
          DATABASE_URL: sqlite:///ci-migrations.db
        run: |
          uv run alembic upgrade head
          uv run alembic check # 모델↔마이그레이션 드리프트 시 실패(마이그레이션 누락 방지)
      - name: Audit (pip-audit)
        working-directory: harness-architect
        run: uv run --with pip-audit pip-audit || true # 리포트 전용(초기 non-blocking)

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: harness-architect/apps/web/pnpm-lock.yaml
      - name: Install
        working-directory: harness-architect/apps/web
        run: pnpm install --frozen-lockfile
      - name: Build (tsc + vite)
        working-directory: harness-architect/apps/web
        run: pnpm build

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install
        working-directory: harness-architect/apps/vscode
        run: npm ci
      - name: Typecheck
        working-directory: harness-architect/apps/vscode
        run: npm run check-types
      - name: Bundle
        working-directory: harness-architect/apps/vscode
        run: npm run compile

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t harness-api:ci harness-architect
      - name: Trivy scan (API image)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true # 리포트 전용: 스캔/설치 실패(레이트리밋 등)가 잡 전체를 막지 않도록
        with:
          image-ref: harness-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0" # 리포트 전용(초기 non-blocking; 안정화 후 1 로 게이트)
      - name: Compose smoke + e2e (SQLite / in-memory)
        env:
          HARNESS_DEV_AUTH: "on" # 실제 OAuth 앱 없이 이메일 dev-login 활성(compose 가 api 컨테이너로 전달)
        run: |
          set -euo pipefail
          docker compose up --build -d api
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break || sleep 2; done
          curl -sf http://localhost:8000/health
          # 인증·격리 관통: dev-login 으로 세션 토큰 발급 → 토큰으로 목록(빈 배열) 확인
          TOKEN=$(curl -s -X POST http://localhost:8000/auth/dev-login \
            -H 'content-type: application/json' -d '{"email":"ci@example.com"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          test -n "$TOKEN"
          test "$(curl -s http://localhost:8000/harnesses -H "Authorization: Bearer $TOKEN")" = "[]"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/harnesses)" = "401"
          docker compose down
