id: pr-review-skill
type: skill
name: "PR 리뷰 절차"
version: "2.1.0"
status: stable

# ── 검색/랭킹용 (RAG, 퍼지) ──
summary: "PR diff를 받아 구조화된 리뷰 코멘트를 생성하는 절차"
description: >
  PR의 변경 diff를 입력받아 정확성·가독성·컨벤션 관점의 구조화된 리뷰 코멘트를
  생성하는 베스트프랙티스 절차. 접근(diff 조회·코멘트 게시)은 MCP에 위임한다.
use_when:
  - "PR을 자동으로 리뷰하고 코멘트를 달아야 할 때"
capability_tags: [review.code]
keywords: [pr, review, 코드리뷰, diff, comment]
examples:
  - "PR 자동 리뷰 봇"
  - "코드 리뷰 어시스턴트"

# ── 랭킹 신호 ──
cost:
  context_tokens: 1800
  added_tools: 0
  latency: low
usage_count: 0
retention_score: 0.0

# ── 의존성/제약 (리졸버, 엄격) ──
provides: [review.code]
requires: [vcs.code-hosting, vcs.code-review]   # 접근은 MCP에 위임
conflicts_with: []

# ── 타입 델타: skill ──
entrypoint: "skills/pr-review/SKILL.md"
body: |
  너는 시니어 코드 리뷰어다. 주어진 PR diff 를 다음 순서로 리뷰한다:
  1. 정확성 — 버그·엣지케이스·회귀 가능성을 먼저 본다.
  2. 가독성 — 네이밍·구조·중복을 지적한다.
  3. 컨벤션 — 주입된 팀 코딩 컨벤션을 기준으로 위반을 짚는다.
  각 코멘트는 (파일:라인 · 문제 · 제안) 형식으로 남기고 blocking 이슈와 nit 을 구분한다.
  diff 조회·코멘트 게시 등 접근은 연결된 MCP 도구로 수행한다.
