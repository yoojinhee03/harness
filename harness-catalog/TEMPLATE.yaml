# ─────────────────────────────────────────────────────────────────────────────
# 컴포넌트 작성 템플릿 — 이 파일을 `components/<id>.yaml` 로 복사해 채운다.
# 이중 필드 원칙(CONTRIBUTING §1): 검색/랭킹용(퍼지) 필드와 계약용(엄격) 필드를 의식적으로 나눈다.
# 각 필드에 좋은 예(✓)/나쁜 예(✗)를 달아둔다. 타입별 델타는 맨 아래 4블록 중 해당 타입만 채운다.
#
# 시딩 규칙(작업 3): 컴포넌트는 실재하는 도구여야 한다(공개 API/패키지가 실제 존재).
# 검증할 수 없으면 넣지 않는다 — 숫자를 채우는 게 목적이 아니다.
# ─────────────────────────────────────────────────────────────────────────────

# ── 식별 (불변 계약) ──
id: my-component            # ✓ 불변 slug(참조 키). 소문자·하이픈. 바꾸면 기존 harness.yaml 참조가 깨진다.
type: skill                 # skill | mcp | context | hook — 아래 타입 델타와 일치해야 한다.
name: "사람이 읽는 이름"
version: "1.0.0"            # semver. 파괴적 변경은 major 상승(CONTRIBUTING §4).
status: stable              # stable | beta | deprecated

# ── 검색/랭킹용 (RAG, 퍼지해도 됨) ── 임베딩·랭킹에만 쓰이므로 자연어로 풍부하게.
summary: "한 줄 요약 — 이게 무엇인지"
description: >
  두세 문장. 무엇을 하고, 접근/실행을 어디에 위임하는지까지. 임베딩 신호가 된다.
use_when:                   # ★ 임베딩의 핵심 신호. "무엇을 하나"가 아니라 "언제 이걸 쓰나"를 쓴다.
  - "이런 상황·의도일 때 이걸 고른다"      # ✓ "PR 을 자동 리뷰하고 코멘트를 달아야 할 때"
  # ✗ "PR 리뷰 스킬"  ← 기능 이름 반복은 신호가 약하다.
capability_tags: [domain.capability]      # 통제 어휘(아래 provides 와 보통 일치). DOMAINS.md 참고.
keywords: [키워드, keyword, 동의어]        # 검색 재현율 보강(오타·동의어·영/한).
examples:
  - "이 컴포넌트가 어울리는 프로젝트 예"

# ── 랭킹 신호 ── 관련성 대비 비용. 피드백 루프가 채우기 전 usage/retention 은 0 으로 둔다.
cost:
  context_tokens: 0         # 매 요청 소비 토큰(context/skill body 크기 추정).
  added_tools: 0            # 노출 도구 수(mcp 는 서버가 노출하는 도구 개수).
  latency: low              # low | medium | high
usage_count: 0
retention_score: 0.0

# ── 의존성/제약 (리졸버·빌더, 엄격) ── 통제 어휘를 정확히. cross-type 연결의 계약면.
provides: [domain.capability]     # 이 컴포넌트가 '공급'하는 능력. requires 와 같은 어휘여야 매칭된다.
requires: []                      # 동작에 필요한 능력(접근은 보통 MCP 에 위임 → 여기 선언).
                                  #   ✓ skill 이 requires:[vcs.code-hosting] → 카탈로그의 mcp 가 provides
                                  #   ✗ 아무도 provides 안 하는 능력을 requires → 영구 gap(콜드스타트 큐로)
conflicts_with: []                # 상호 배타 컴포넌트 id(양방향 일관되게).
constraints:
  exclusive_group: ""             # 같은 그룹은 하나만 선택 가능(예: vcs).

# ── 실행/설정 (빌더, 엄격) ──
# auth:
#   required: true
#   type: oauth
#   scopes: ["repo:read"]
# config_schema: { type: object, properties: {} }   # jsonschema — sel.config 를 검증한다.
# defaults: {}                                       # config_schema 기본값.

# ─────────────────────────── 타입 델타 (해당 타입만 채운다) ───────────────────────────

# ── skill 델타 ──
# entrypoint: "skills/<id>/SKILL.md"
# body: |
#   (선택) 스킬 본문 — SKILL.md 로 방출되는 절차 텍스트.

# ── mcp 델타 ── ★ 실존 서버만. 지어낸 'OO Connector' 금지(그라운딩 계약).
# usage_note: >
#   이 서버를 언제·어떻게 쓰나(상위 사용 전략) — CLAUDE.md Capabilities 절로 방출.
# mcp:
#   transport: stdio            # stdio | http | sse
#   command: npx                # stdio: 실제 실행 명령
#   args: ["-y", "@scope/real-server"]
#   env: { API_TOKEN: "${API_TOKEN}" }   # 비밀은 ${ENV} 확장(파일에 박지 않는다).
#   # http/sse: url: "https://…"

# ── context 델타 ──
# source: inline               # inline | file
# body: |
#   컨텍스트/프롬프트 조각 본문 — prompt.system[].ref 로 주입되는 실제 텍스트.

# ── hook 델타 ── ★ 리뷰 게이트(CONTRIBUTING §3). failure·timeout_ms 필수(리졸버가 강제).
# events: [before_tool_call]   # before_request|after_request|before_tool_call|after_tool_call|after_response
# sandbox: restricted          # none(명시 승인 필요) | restricted(기본) | external
# blocking: true               # 요청 차단 가능(리뷰 대상)
# can_modify_request: false
# can_modify_response: false
# failure: fail_closed         # guardrail/validation → fail_closed, 관찰(logging) → fail_open [필수]
# timeout_ms: 2000             # [필수] 격리 런타임이 강제하는 상한
# depends_on: []
# emit_command: ""             # eject 시 방출할 실제 셸 명령(없으면 자리표시)
# ⚠️ hook 은 lifecycle 부수효과만 provides 한다. 다른 컴포넌트(skill/mcp/context)의 능력을
#    provides 로 중복 선언하면 = 파이프라인 본작업을 훅으로 위장 → 리졸버가 검증 실패시킨다.
