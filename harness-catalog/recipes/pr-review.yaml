# 레시피 — 카탈로그 *위의* 큐레이션. 컴포넌트를 새로 만들지 않고 검증된 조합만 담는다.
# 시작점이지 정답이 아니다: 만들고 나서 자기 팀에 맞게 고치라고 있는 것이다.
recipe:
  name: pr-review
  title: PR 리뷰 봇
  description: GitHub PR 을 코드 리뷰하고 결과를 슬랙으로 알린다. 팀 컨벤션을 따르고 시크릿 유출을 막는다.
  use_when:
    - 코드 리뷰 코멘트를 자동화하고 싶다
    - 팀 코딩 컨벤션을 리뷰에 강제하고 싶다

harness:
  metadata:
    id: pr-review-bot
    name: PR 리뷰 봇
  model:
    name: claude-sonnet-5
  permissions:
    vcs.code-hosting: read-only
  components:
    - ref: github-mcp@1.4.0
    - ref: pr-review-skill@2.1.0
    - ref: coding-convention-ctx@1.0.0
    - ref: slack-mcp@1.1.0
    - ref: secret-scan-hook@1.2.0
  prompt:
    system:
      - ref: prompt-role-reviewer@1.0.0
      - ref: prompt-format-structured-review@1.0.0
