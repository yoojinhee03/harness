recipe:
  name: doc-draft
  title: 문서 초안 작성기
  description: 노션 위키를 참고해 회의록·보고서 초안을 쓴다.
  use_when:
    - 반복되는 문서 작업의 초안을 자동화하고 싶다
    - 사내 위키의 맥락을 반영한 문서가 필요하다

harness:
  metadata:
    id: doc-draft-bot
    name: 문서 초안 작성기
  model:
    name: claude-sonnet-5
  permissions:
    knowledge.wiki: read-only
  components:
    - ref: notion-mcp@1.0.0
    - ref: doc-draft-skill@1.0.0
  prompt:
    system:
      - inline: 너는 문서 초안을 쓴다. 위키에서 확인되지 않은 사실은 지어내지 말고 빈칸으로 남긴다.
