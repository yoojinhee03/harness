# 풀스택 로컬 실행 (레포 루트) — 백엔드(FastAPI) + 프론트(nginx 정적 서빙, /api 프록시).
# 코드(harness-architect)와 데이터(harness-catalog)가 모두 보이는 이 루트가 진입점이다.
#
#   docker compose up --build                     # → http://localhost:8080
#   docker compose --profile pgvector up --build  # + pgvector DB
#   docker compose down                           # 정리 (-v 로 DB 볼륨까지)
#
# 카탈로그 데이터는 옆 폴더를 API 컨테이너에 읽기전용 마운트한다(이미지에 굽지 않음).
# API 키는 선택 — 없으면 로컬 임베딩/휴리스틱 폴백으로 전 구간이 돈다. 채우려면 이 파일
# 옆에 .env 를 두고 ANTHROPIC_API_KEY / VOYAGE_API_KEY 를 넣는다(.env.example 참고).
#
# 호스트 포트는 env 로 바꿀 수 있다(다른 스택과 충돌 시). 기본 웹 8080·API 8000 —
# Vite 기본 포트(5173)는 이미 다른 개발 서버가 쓰는 경우가 많아 피했다.
#   WEB_PORT=9000 API_PORT=9001 docker compose up   (또는 .env 에 지정)

services:
  api:
    build:
      context: ./harness-architect
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 마운트한 카탈로그 컴포넌트 폴더를 직접 가리킨다(loader 의 CATALOG_DIR 계약).
      CATALOG_DIR: /catalog
      # 공유 하네스 저장소 위치(웹↔확장 동기화). 아래 볼륨으로 호스트에 영속·공유.
      HARNESS_STORE_DIR: /store
      # 저장소 DB — 비우면 /store 밑 SQLite(단일 인스턴스). 스케일아웃/프로덕션은 Postgres URL 지정
      # (예: postgresql+psycopg://harness:harness@db:5432/harness — pgvector 프로파일과 함께).
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://harness:harness@db:5432/harness}
      # SSE 스케일아웃 — 비우면 인메모리(단일 프로세스). 워커·레플리카를 늘리면 Redis 지정(redis://redis:6379).
      REDIS_URL: ${REDIS_URL:-}
      # 없으면 빈 값 → 자동으로 로컬 폴백. 있으면 품질 모드 자동 활성.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # 카탈로그 harvest — 공식 MCP 레지스트리 + 플러그인 마켓플레이스를 백그라운드 스케줄러가 DB 에
      # 적재하고 서빙은 DB 만 읽는다(.env 로 제어, 기본 off=로컬 13개). 서빙 경로엔 네트워크 없음.
      HARNESS_LIVE_REGISTRY: ${HARNESS_LIVE_REGISTRY:-off}
      HARNESS_MARKETPLACE: ${HARNESS_MARKETPLACE:-off}
      HARNESS_REGISTRY_MAX_PAGES: ${HARNESS_REGISTRY_MAX_PAGES:-50}
      HARNESS_REGISTRY_ENRICH_MAX: ${HARNESS_REGISTRY_ENRICH_MAX:-150}
      # 하이브리드 harvest — sync 주기(증분, 기본 1h) + full 대조 주기(기본 24h).
      HARNESS_CATALOG_SYNC_INTERVAL: ${HARNESS_CATALOG_SYNC_INTERVAL:-3600}
      HARNESS_CATALOG_FULL_INTERVAL: ${HARNESS_CATALOG_FULL_INTERVAL:-86400}
      # 로그인(OAuth) — 사람은 GitHub OAuth, 기계(VSCode)는 설정에서 발급한 PAT.
      # 아래가 모두 비면 로그인 방법이 없어 안내 화면만 뜬다(.env 에 채우거나 dev-auth 를 켠다).
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      # 콜백/복귀 주소 — nginx 로 서빙되는 웹 오리진 기준(기본 8080). GitHub 앱 콜백 URL 과 일치해야 함.
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-http://localhost:8080/api}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:8080}
      # 개발용 이메일 로그인(실제 OAuth 앱 없이). 로컬에서 바로 로그인하려면 .env 에 HARNESS_DEV_AUTH=on.
      HARNESS_DEV_AUTH: ${HARNESS_DEV_AUTH:-}
    volumes:
      - ./harness-catalog/components:/catalog:ro
      # 저장한 하네스를 호스트에 영속(compose down 후에도 유지) + 호스트 백엔드와 동일 폴더 공유.
      - ./.harness-store:/store
    ports:
      - "${API_PORT:-8000}:8000"   # OpenAPI: http://localhost:8000/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./harness-architect/apps/web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"     # 브라우저 진입점: http://localhost:8080
    depends_on:
      api:
        condition: service_healthy   # nginx 가 api DNS 를 못 찾고 죽지 않도록 대기.

  # Redis — SSE 스케일아웃(다중 워커/레플리카)용. 기본 미기동. `--profile scale` + REDIS_URL 로 활성.
  redis:
    image: redis:7-alpine
    profiles: ["scale"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # pgvector(Postgres) — 저장소 기본 DB(2026-08 SQLite 에서 전환). api 가 depends_on 으로 healthy 대기.
  # 호스트 포트는 55432(로컬 5432 를 다른 스택이 점유해 충돌 회피). 컨테이너 간은 db:5432 내부 네트워크.
  # SQLite 로 되돌리려면 DATABASE_URL= (빈 값) 로 오버라이드.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
