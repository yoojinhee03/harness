# 로컬 개발 인프라 — postgres + pgvector (RAG 확장 시). 개발: 기술 스택 §4.
# MVP 는 인메모리 벡터 스토어라 이 DB 없이도 백엔드가 돈다.
#
# 이건 "네이티브(uv/pnpm) 개발 중 DB 만 도커로" 쓰는 헬퍼다. 백엔드·프론트까지 컨테이너로
# 한 번에 띄우려면 레포 루트의 docker-compose.yml 을 쓴다:  (repo root)$ docker compose up --build

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
