[project]
name = "harness-architect"
version = "0.1.0"
description = "AI 하네스 아키텍트 — 모노레포 루트 (uv 워크스페이스)"
requires-python = ">=3.12"
readme = "README.md"

[tool.uv.workspace]
members = ["packages/*", "apps/api"]

[tool.uv.sources]
harness-resolver = { workspace = true }
harness-catalog = { workspace = true }
harness-runtime = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[tool.ruff]
# 한국어 주석·문자열이 많아 120 으로 둔다(한글은 한 줄에 실질 정보량이 크다).
line-length = 120
target-version = "py312"
src = ["packages", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps"]
