[project]
name = "harness-api"
version = "0.1.0"
description = "FastAPI 백엔드 — /catalog, /recommend, /resolve, /generate. 화면 A·B·C·E 를 서빙."
requires-python = ">=3.12"
dependencies = [
    "harness-resolver",
    "harness-catalog",
    "harness-runtime",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_api"]
