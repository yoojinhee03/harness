[project]
name = "harness-api"
version = "0.1.0"
description = "FastAPI 백엔드 — /catalog, /recommend, /resolve, /generate. 화면 A·B·C·E 를 서빙."
requires-python = ">=3.12"
dependencies = [
    "harness-resolver",
    "harness-catalog",
    "harness-runtime",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.0",
    "httpx>=0.27",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# 프로덕션 인프라(선택) — Postgres 드라이버 + Redis(SSE 스케일아웃). 개발/테스트는 SQLite·인메모리.
postgres = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.0"]
# 에러 트래킹(선택) — SENTRY_DSN 설정 시 활성.
sentry = ["sentry-sdk[fastapi]>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_api"]
