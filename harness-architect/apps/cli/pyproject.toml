[project]
name = "harness-cli"
version = "0.1.0"
description = "harness CLI — harness.yaml 을 resolve/eject 한다 (웹 없이 터미널 완결)."
requires-python = ">=3.12"
dependencies = [
    "harness-resolver",
    "harness-catalog",
    "harness-runtime",
    "pyyaml>=6.0",
]

[project.scripts]
harness = "harness_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_cli"]
