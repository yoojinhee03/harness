# 프론트 정적 서빙 + /api 프록시.
# 개발(vite.config.ts)의 proxy rewrite(/api → "")를 그대로 재현한다:
#   /api/catalog  →  http://api:8000/catalog
server {
    listen 80;
    server_name _;

    # 보안 헤더 — 앱은 자기완결(외부 CDN 없음)이라 default-src 'self'. 인라인 스타일만 허용,
    # connect-src 'self'(SSE 포함, 프록시로 동일 오리진). 클릭재킹·MIME 스니핑 차단.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA — 라우팅은 클라이언트가 담당, 새로고침/딥링크는 index.html 로 폴백.
    location / {
        root      /usr/share/nginx/html;
        index     index.html;
        try_files $uri $uri/ /index.html;
    }

    # /api/* → 백엔드 컨테이너. proxy_pass 의 트레일링 슬래시가 접두사(/api)를 벗긴다.
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
