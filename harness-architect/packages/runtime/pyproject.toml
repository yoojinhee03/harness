[project]
name = "harness-runtime"
version = "0.1.0"
description = "런타임 레이어 (스켈레톤) — 요청 빌더 + 훅 엔진. ResolvedHarness → Anthropic API 호출."
requires-python = ">=3.12"
dependencies = [
    "harness-resolver",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_runtime"]
