[project]
name = "harness-catalog"
version = "0.1.0"
description = "카탈로그 엔진 + RAG — 로딩·임베딩·검색·랭킹. RAG 엔진 코드는 백엔드에 잔류(데이터는 별도 폴더)."
requires-python = ">=3.12"
dependencies = [
    "harness-resolver",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 품질 모드 — 키가 있을 때만. 로컬 폴백은 이 없이도 돈다.
voyage = ["voyageai>=0.3"]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.40"]  # OpenAI 임베딩(text-embedding-3) — HARNESS_EMBEDDER=openai

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/harness_catalog 안에는 배포용 카탈로그 스냅샷(catalog-data/components)이 함께 들어간다.
# 소스 오브 트루스는 옆 폴더 harness-catalog/components 이며, 스냅샷은 그 빌드용 사본이다
# (scripts/sync_catalog_snapshot.py 로 동기화, drift 는 test_catalog_snapshot.py 가 잡는다).
# 설치본에선 loader 가 harness_catalog/catalog-data/components 를 자동 탐색한다.
packages = ["src/harness_catalog"]
