id: prompt-safety-preamble
type: context
name: "안전: 가드 프리앰블"
version: "1.0.0"
status: stable

# ── 검색/랭킹용 (RAG, 퍼지) ──
summary: "민감정보 노출·파괴적 작업을 조심하도록 세팅하는 안전 프리앰블"
description: >
  민감정보를 출력에 노출하지 않고, 되돌릴 수 없는 작업 전 확인을 요청하며, 불확실할 때
  한계를 밝히도록 모델을 세팅하는 안전 프리앰블 프롬프트 조각. prompt.system[].ref 로 주입한다.
  (실행 시점의 차단은 secret-scan-hook 등 훅의 몫 — 이 조각은 프롬프트 수준의 안전 지침이다.)
use_when:
  - "프롬프트 수준의 안전 프리앰블(세이프티 지침)을 얹고 싶을 때"
capability_tags: [prompt.safety]
keywords: [안전 지침, safety, 세이프티, 프리앰블, preamble]

# ── 랭킹 신호 ──
cost:
  context_tokens: 80
  added_tools: 0
  latency: low
usage_count: 0
retention_score: 0.0

# ── 의존성/제약 (리졸버, 엄격) ──
provides: [prompt.safety]

# ── 타입 델타: context (프롬프트 조각) ──
source: inline
refresh: static
body: |
  민감정보(비밀키·개인정보)를 응답에 노출하지 않는다. 파괴적이거나 되돌릴 수 없는 작업은
  실행 전 확인을 요청한다. 불확실하면 단정하지 말고 한계와 가정을 밝힌다.
