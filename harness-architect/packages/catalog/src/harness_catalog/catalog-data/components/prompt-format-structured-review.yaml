id: prompt-format-structured-review
type: context
name: "형식: 구조화 리뷰 출력"
version: "1.0.0"
status: stable

# ── 검색/랭킹용 (RAG, 퍼지) ──
summary: "리뷰 결과를 요약·이슈목록·제안 세 섹션으로 내는 출력 형식 지침"
description: >
  응답을 일관된 세 섹션(요약 · 발견 이슈 · 개선 제안)으로 강제하는 출력 형식 프롬프트 조각.
  이슈마다 파일·라인 근거와 심각도 태그를 붙이게 한다. prompt.system[].ref 로 주입한다.
use_when:
  - "리뷰/분석 출력의 형식을 일관되게 고정하고 싶을 때"
capability_tags: [prompt.format]
keywords: [출력 형식, output format, 포맷, format, 구조화, 섹션]

# ── 랭킹 신호 ──
cost:
  context_tokens: 90
  added_tools: 0
  latency: low
usage_count: 0
retention_score: 0.0

# ── 의존성/제약 (리졸버, 엄격) ──
provides: [prompt.format]

# ── 타입 델타: context (프롬프트 조각) ──
source: inline
refresh: static
body: |
  출력은 세 섹션으로 구성한다: (1) 한 줄 요약, (2) 발견 이슈 목록(각 항목에 심각도 태그와
  파일·라인 근거), (3) 구체적 개선 제안. 근거 없는 단정은 넣지 않는다.
