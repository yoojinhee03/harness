id: coding-convention-ctx
type: context
name: "코딩 컨벤션"
version: "1.0.0"
status: stable

# ── 검색/랭킹용 (RAG, 퍼지) ──
summary: "팀 코딩 스타일 가이드를 컨텍스트로 주입"
description: >
  팀의 코딩 스타일 가이드(네이밍·포맷·구조 규칙)를 컨텍스트로 주입해 리뷰·생성이
  팀 기준에 맞춰지게 한다. 매 요청 토큰을 소비하므로 cost가 랭킹에서 민감하다.
use_when:
  - "리뷰를 팀 코딩 기준에 맞춰야 할 때"
capability_tags: [convention.coding]
keywords: [style, convention, lint, 컨벤션, 스타일가이드]
examples:
  - "PR 자동 리뷰 봇"
  - "팀 컨벤션 준수 어시스턴트"

# ── 랭킹 신호 ──
cost:
  context_tokens: 1200
  added_tools: 0
  latency: low
usage_count: 0
retention_score: 0.0

# ── 의존성/제약 (리졸버, 엄격) ──
provides: [convention.coding]
requires: []
conflicts_with: []

# ── 타입 델타: context ──
source: "file"
size_estimate: 1200
refresh: static
body: |
  팀 코딩 컨벤션(요약):
  - 네이밍: 함수·변수 snake_case, 클래스 PascalCase, 상수 UPPER_SNAKE.
  - 포맷: 들여쓰기 4칸, 최대 줄 길이 100, import 는 표준→서드파티→로컬 순.
  - 구조: 함수는 한 가지 일만, 부수효과는 경계에 모은다.
  리뷰·생성은 위 기준을 우선 적용한다. style_guide config 로 세부 프리셋(google/airbnb/pep8)을 선택한다.

# ── 실행/설정 (빌더, 엄격) ──
config_schema:
  type: object
  properties:
    style_guide:
      type: string
      enum: [google, airbnb, pep8]
defaults:
  style_guide: "google"
