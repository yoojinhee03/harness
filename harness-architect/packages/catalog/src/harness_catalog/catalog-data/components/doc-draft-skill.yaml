id: doc-draft-skill
type: skill
name: "문서 초안 작성 절차"
version: "1.0.0"
status: stable

summary: "입력 자료를 받아 구조화된 문서 초안을 작성하는 절차"
description: >
  회의록·노트 등 입력 자료를 받아 요약·구조화한 문서 초안을 작성하는 절차. 저장 위치
  접근(위키)은 knowledge.wiki 를 제공하는 MCP 에 위임한다.
use_when:
  - "회의록·자료를 요약해 문서 초안을 만들어야 할 때"
  - "구조화된 보고서·문서를 생성해야 할 때"
capability_tags: [author.document]
keywords: [문서, 초안, 요약, 회의록, document, draft, 보고서]
examples:
  - "문서 초안 작성기"
  - "회의록 요약 봇"

cost:
  context_tokens: 2000
  added_tools: 0
  latency: low
usage_count: 0
retention_score: 0.0

provides: [author.document]
requires: [knowledge.wiki]   # 저장 위치 접근은 위키 MCP 에 위임
conflicts_with: []

entrypoint: "skills/doc-draft/SKILL.md"
injection_mode: context
body: |
  너는 기술 문서 작성자다. 주어진 입력 자료(회의록·노트·조사 결과)를 받아:
  1. 핵심 요지를 3~5줄로 요약한다.
  2. 제목 / 배경 / 상세 / 결정·액션아이템 구조로 초안을 작성한다.
  3. 사실과 추정을 구분하고, 출처가 있으면 링크로 남긴다.
  저장(위키)은 knowledge.wiki 를 제공하는 MCP 로 수행한다.
