id: secret-scan-hook
type: hook
name: "시크릿 스캔 가드레일"
version: "1.2.0"
status: stable

# ── 검색/랭킹용 (RAG, 퍼지) ──
summary: "도구 호출 전 노출된 자격증명·비밀을 차단"
description: >
  도구 호출 직전 요청 페이로드를 검사해 노출된 자격증명·API 키·비밀이 외부로
  나가지 않도록 차단하는 가드레일 훅. 실패 시 fail_closed로 요청을 중단한다.
use_when:
  - "리뷰 과정에서 비밀이 새지 않게 해야 할 때"
capability_tags: [lifecycle.guardrail]
keywords: [secret, security, guardrail, 보안, 시크릿, 스캔]
examples:
  - "PR 자동 리뷰 봇"
  - "보안 가드레일이 필요한 에이전트"

# ── 랭킹 신호 ──
cost:
  context_tokens: 0
  added_tools: 0
  latency: low
usage_count: 0
retention_score: 0.0

# ── 의존성/제약 (리졸버, 엄격) ──
provides: [lifecycle.guardrail]
requires: []
conflicts_with: []

# ── 타입 델타: hook (훅 실행 모델) ──
events: [before_tool_call]
sandbox: restricted
blocking: true
can_modify_request: false
can_modify_response: false
failure: fail_closed
timeout_ms: 2000
depends_on: []
# eject 시 방출할 실제 셸 명령 — stdin(도구 호출 JSON)에서 흔한 비밀 패턴을 찾아 exit 2 로 차단.
emit_command: "grep -qiE '(api[_-]?key|secret|password|token|ghp_[A-Za-z0-9]{20,}|xox[baprs]-|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' && { echo 'secret-scan: 잠재적 비밀 감지 - 차단' >&2; exit 2; } || exit 0"
